<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'none';
      script-src 'unsafe-inline';
      style-src 'unsafe-inline';
      connect-src 'none';
      img-src 'none';
      font-src 'none';
      object-src 'none';
      base-uri 'none';
      form-action 'none';
    "
  >

  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Copy value</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f5f5;
      color: #242424;
    }

    .panel {
      width: min(420px, 100%);
      padding: 24px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e1e1e1;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .spinner {
      width: 24px;
      height: 24px;
      margin: 0 auto 14px;
      border: 3px solid #d6e8f7;
      border-top-color: #0f6cbd;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #status {
      margin: 0;
      font-size: 14px;
      line-height: 20px;
    }

    button {
      margin-top: 16px;
      padding: 9px 18px;
      border: 0;
      border-radius: 4px;
      background: #0f6cbd;
      color: #ffffff;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #115ea3;
    }

    button:focus-visible {
      outline: 2px solid #242424;
      outline-offset: 2px;
    }

    button:disabled {
      cursor: default;
      opacity: 0.65;
    }

    textarea {
      width: 100%;
      min-height: 70px;
      margin-top: 16px;
      padding: 9px;
      resize: vertical;
      border: 1px solid #a8a8a8;
      border-radius: 4px;
      background: #ffffff;
      color: #242424;
      font: inherit;
      line-height: 20px;
      overflow-wrap: anywhere;
    }

    textarea:focus {
      border-color: #0f6cbd;
      outline: 2px solid rgba(15, 108, 189, 0.2);
    }

    .help {
      margin: 8px 0 0;
      color: #616161;
      font-size: 12px;
      line-height: 17px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="panel">
    <div id="spinner" class="spinner" aria-hidden="true"></div>

    <p id="status" role="status" aria-live="polite">
      Preparing to copy…
    </p>

    <button id="copyButton" type="button" hidden>
      Copy now
    </button>

    <textarea
      id="manualValue"
      rows="3"
      readonly
      autocomplete="off"
      spellcheck="false"
      aria-label="Value to copy"
      hidden
    ></textarea>

    <p id="manualHelp" class="help" hidden>
      If Edge still blocks clipboard access, click the value above and press Ctrl+C.
    </p>
  </main>

  <script>
    (function () {
      "use strict";

      const spinner = document.getElementById("spinner");
      const status = document.getElementById("status");
      const copyButton = document.getElementById("copyButton");
      const manualValue = document.getElementById("manualValue");
      const manualHelp = document.getElementById("manualHelp");

      const encodedValue = window.location.hash.substring(1);
      const valueWasSupplied = encodedValue.length > 0;

      let value = "";
      let copying = false;
      let completed = false;

      if (valueWasSupplied) {
        try {
          value = decodeURIComponent(encodedValue);
        } catch {
          // Preserve the original value if it was not valid URI encoding.
          value = encodedValue;
        }
      }

      /*
       * Remove the value from the visible URL and current history entry.
       * The value remains available only in this page's memory.
       */
      try {
        window.history.replaceState(
          null,
          document.title,
          window.location.pathname + window.location.search
        );
      } catch {
        // The page can continue safely if history replacement is unavailable.
      }

      function isActiveDocument() {
        return (
          document.visibilityState === "visible" &&
          document.hasFocus()
        );
      }

      function focusSafely(element) {
        try {
          element.focus({ preventScroll: true });
        } catch {
          try {
            element.focus();
          } catch {
            // Continue if focus cannot be changed.
          }
        }
      }

      function selectManualValue() {
        if (manualValue.hidden) {
          return;
        }

        if (document.activeElement !== manualValue) {
          focusSafely(manualValue);
        }

        try {
          manualValue.select();
          manualValue.setSelectionRange(
            0,
            manualValue.value.length
          );
        } catch {
          // The user can still select the text manually.
        }
      }

      /*
       * Wait for the new tab to become visible and focused.
       * A strict timeout prevents the page remaining on a spinner.
       */
      function waitForActiveDocument(timeoutMilliseconds) {
        return new Promise(function (resolve) {
          let settled = false;
          let focusTimer = 0;
          let timeoutTimer = 0;

          function cleanup() {
            window.clearTimeout(focusTimer);
            window.clearTimeout(timeoutTimer);

            window.removeEventListener("focus", check);
            window.removeEventListener("pageshow", check);

            document.removeEventListener(
              "visibilitychange",
              check
            );
          }

          function finish(result) {
            if (settled) {
              return;
            }

            settled = true;
            cleanup();
            resolve(result);
          }

          function check() {
            if (!isActiveDocument()) {
              return;
            }

            window.clearTimeout(focusTimer);

            /*
             * Give Edge enough time to finish activating and painting
             * the newly opened tab.
             */
            focusTimer = window.setTimeout(function () {
              if (isActiveDocument()) {
                finish(true);
              }
            }, 60);
          }

          window.addEventListener("focus", check);
          window.addEventListener("pageshow", check);

          document.addEventListener(
            "visibilitychange",
            check
          );

          timeoutTimer = window.setTimeout(function () {
            finish(false);
          }, timeoutMilliseconds);

          check();
        });
      }

      /*
       * Use the current Clipboard API, but place a strict time limit
       * around it in case Edge leaves the permission request pending.
       */
      async function modernCopy(
        text,
        timeoutMilliseconds
      ) {
        let timeoutTimer = 0;

        try {
          if (
            !isActiveDocument() ||
            !window.isSecureContext ||
            !navigator.clipboard ||
            typeof navigator.clipboard.writeText !== "function"
          ) {
            return false;
          }

          const writeResult =
            navigator.clipboard.writeText(text).then(
              function () {
                return true;
              },
              function () {
                return false;
              }
            );

          const timeoutResult = new Promise(function (resolve) {
            timeoutTimer = window.setTimeout(function () {
              resolve(false);
            }, timeoutMilliseconds);
          });

          return await Promise.race([
            writeResult,
            timeoutResult
          ]);
        } catch {
          return false;
        } finally {
          window.clearTimeout(timeoutTimer);
        }
      }

      /*
       * Legacy copy is retained because it is often allowed when
       * executed directly from a trusted button click.
       */
      function legacyCopy(text) {
        if (!isActiveDocument()) {
          return false;
        }

        const temporaryValue =
          document.createElement("textarea");

        temporaryValue.value = text;
        temporaryValue.readOnly = true;
        temporaryValue.tabIndex = -1;
        temporaryValue.setAttribute("aria-hidden", "true");

        temporaryValue.style.position = "fixed";
        temporaryValue.style.top = "0";
        temporaryValue.style.left = "0";
        temporaryValue.style.width = "2px";
        temporaryValue.style.height = "2px";
        temporaryValue.style.padding = "0";
        temporaryValue.style.border = "0";
        temporaryValue.style.opacity = "0.01";
        temporaryValue.style.pointerEvents = "none";

        document.body.appendChild(temporaryValue);

        let successful = false;

        try {
          focusSafely(temporaryValue);

          temporaryValue.select();
          temporaryValue.setSelectionRange(
            0,
            temporaryValue.value.length
          );

          successful =
            document.execCommand("copy") === true;
        } catch {
          successful = false;
        } finally {
          temporaryValue.remove();
        }

        return successful;
      }

      function setCopyingState() {
        copying = true;

        spinner.hidden = false;
        status.textContent = "Copying…";

        copyButton.disabled = true;
        copyButton.hidden = true;

        manualValue.hidden = true;
        manualHelp.hidden = true;
      }

      function showFallback(buttonAttemptFailed) {
        if (completed) {
          return;
        }

        copying = false;

        spinner.hidden = true;

        copyButton.disabled = false;
        copyButton.hidden = false;

        manualValue.value = value;
        manualValue.hidden = false;
        manualHelp.hidden = false;

        if (buttonAttemptFailed) {
          status.textContent =
            "Clipboard access is restricted. The value is selected—press Ctrl+C.";

          window.setTimeout(selectManualValue, 0);
        } else {
          status.textContent =
            "Automatic copying was blocked. Select Copy now.";

          window.setTimeout(function () {
            focusSafely(copyButton);
          }, 0);
        }
      }

      function clearSensitiveValue() {
        value = "";
        manualValue.value = "";
      }

      function copySucceeded() {
        if (completed) {
          return;
        }

        completed = true;
        copying = false;

        spinner.hidden = true;
        status.textContent = "Copied to clipboard.";

        copyButton.disabled = true;
        copyButton.hidden = true;

        manualValue.hidden = true;
        manualHelp.hidden = true;

        clearSensitiveValue();

        /*
         * This should work because the page was opened from the
         * Microsoft Lists link. If Edge refuses to close it, the
         * completed message remains visible.
         */
        try {
          window.close();
        } catch {
          // Show the completed message if closing is restricted.
        }

        window.setTimeout(function () {
          status.textContent =
            "Copied to clipboard. You can close this tab.";
        }, 150);
      }

      async function runAutomaticCopy() {
        const documentIsReady =
          await waitForActiveDocument(1800);

        if (completed) {
          return;
        }

        if (!documentIsReady) {
          showFallback(false);
          return;
        }

        setCopyingState();

        /*
         * Make only one Clipboard API request at a time.
         * The original version started two competing copy operations.
         */
        const modernSucceeded =
          await modernCopy(value, 1600);

        if (completed) {
          return;
        }

        if (modernSucceeded) {
          copySucceeded();
          return;
        }

        /*
         * Try the older synchronous method only after the modern
         * request has conclusively failed or timed out.
         */
        if (
          isActiveDocument() &&
          legacyCopy(value)
        ) {
          copySucceeded();
          return;
        }

        showFallback(false);
      }

      copyButton.addEventListener("click", function () {
        if (copying || completed || !valueWasSupplied) {
          return;
        }

        setCopyingState();

        /*
         * During a real button click, try the synchronous method
         * first so it executes inside Edge's trusted click event.
         */
        if (legacyCopy(value)) {
          copySucceeded();
          return;
        }

        /*
         * This call begins immediately inside the same trusted
         * click event, even though its result is asynchronous.
         */
        modernCopy(value, 2000).then(
          function (successful) {
            if (successful) {
              copySucceeded();
            } else {
              showFallback(true);
            }
          },
          function () {
            showFallback(true);
          }
        );
      });

      manualValue.addEventListener("focus", function () {
        window.setTimeout(selectManualValue, 0);
      });

      manualValue.addEventListener(
        "click",
        selectManualValue
      );

      /*
       * When the user performs a native Ctrl+C operation, allow it
       * to complete before clearing the value and closing the tab.
       */
      manualValue.addEventListener("copy", function (event) {
        if (!event.isTrusted || completed) {
          return;
        }

        window.setTimeout(copySucceeded, 0);
      });

      window.addEventListener(
        "pagehide",
        clearSensitiveValue,
        { once: true }
      );

      if (!valueWasSupplied) {
        spinner.hidden = true;
        status.textContent = "No value was supplied.";
        return;
      }

      /*
       * Any unexpected failure now leads to the visible fallback
       * instead of leaving the page permanently spinning.
       */
      runAutomaticCopy().catch(function () {
        showFallback(false);
      });
    })();
  </script>
</body>
</html>
