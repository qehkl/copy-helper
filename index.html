<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'none';
      script-src 'unsafe-inline';
      style-src 'unsafe-inline';
      connect-src 'none';
      img-src 'none';
      font-src 'none';
      object-src 'none';
      base-uri 'none';
      form-action 'none';
    "
  >

  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Copy value</title>

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f5f5;
      color: #242424;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel {
      width: min(380px, calc(100% - 40px));
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e1e1e1;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    button {
      margin-top: 16px;
      padding: 9px 18px;
      border: 0;
      border-radius: 4px;
      background: #0f6cbd;
      color: #ffffff;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #115ea3;
    }

    button[hidden] {
      display: none;
    }

    #copySource {
      position: fixed;
      top: 0;
      left: -10000px;
      width: 1px;
      height: 1px;
      padding: 0;
      border: 0;
      opacity: 0;
    }
  </style>
</head>

<body>
  <main class="panel">
    <div id="status" role="status" aria-live="polite">
      Copying…
    </div>

    <button id="copyButton" type="button" hidden>
      Copy to clipboard
    </button>
  </main>

  <textarea
    id="copySource"
    readonly
    aria-hidden="true"
    tabindex="-1"
  ></textarea>

  <script>
    (function () {
      "use strict";

      const status = document.getElementById("status");
      const copyButton = document.getElementById("copyButton");
      const copySource = document.getElementById("copySource");

      const parameters = new URLSearchParams(window.location.search);
      const openedAsNewTab = window.history.length === 1;

      // Extra protection: never close a tab containing previous history.
      const shouldClose =
        parameters.get("close") === "1" && openedAsNewTab;

      const encodedValue = window.location.hash.substring(1);

      if (!encodedValue) {
        status.textContent = "No value was supplied.";
        return;
      }

      let value;

      try {
        value = decodeURIComponent(encodedValue);
      } catch {
        value = encodedValue;
      }

      copySource.value = value;

      // Remove the value from the visible URL and current history entry.
      window.history.replaceState(
        null,
        document.title,
        window.location.pathname + window.location.search
      );

      let completed = false;
      let automaticAttempted = false;
      let copying = false;

      function documentIsFocused() {
        return (
          document.visibilityState === "visible" &&
          document.hasFocus()
        );
      }

      async function modernCopy() {
        if (
          !value ||
          !window.isSecureContext ||
          !documentIsFocused() ||
          !navigator.clipboard ||
          typeof navigator.clipboard.writeText !== "function"
        ) {
          return false;
        }

        try {
          await navigator.clipboard.writeText(value);
          return true;
        } catch {
          return false;
        }
      }

      function legacyCopy() {
        if (!value || !documentIsFocused()) {
          return false;
        }

        let copyEventHandled = false;

        function handleCopy(event) {
          if (!event.clipboardData) {
            return;
          }

          event.preventDefault();
          event.clipboardData.clearData();
          event.clipboardData.setData("text/plain", value);
          copyEventHandled = true;
        }

        document.addEventListener("copy", handleCopy, { once: true });

        copySource.value = value;
        copySource.focus({ preventScroll: true });
        copySource.select();
        copySource.setSelectionRange(0, copySource.value.length);

        let commandWorked = false;

        try {
          commandWorked = document.execCommand("copy");
        } catch {
          commandWorked = false;
        }

        document.removeEventListener("copy", handleCopy);

        return commandWorked && copyEventHandled;
      }

      function showCopyButton(message) {
        status.textContent =
          message ||
          "Automatic copying was blocked. Select the button below.";

        copyButton.hidden = false;
        copyButton.focus();
      }

      function finishSuccessfully() {
        if (completed) {
          return;
        }

        completed = true;
        status.textContent = "Copied to clipboard.";
        copyButton.hidden = true;

        copySource.value = "";
        value = "";

        window.setTimeout(function () {
          if (shouldClose) {
            // This runs only inside the newly opened helper tab.
            window.close();

            // Displayed only if Edge blocks automatic tab closing.
            window.setTimeout(function () {
              status.textContent =
                "Copied. You can now close this tab.";
            }, 300);
          } else {
            status.textContent =
              "Copied. You can now close this tab.";
          }
        }, 250);
      }

      async function attemptAutomaticCopy() {
        if (
          completed ||
          copying ||
          automaticAttempted ||
          !documentIsFocused()
        ) {
          return;
        }

        automaticAttempted = true;
        copying = true;
        status.textContent = "Copying…";

        const modernWorked = await modernCopy();
        const legacyWorked =
          modernWorked ? false : legacyCopy();

        copying = false;

        if (modernWorked || legacyWorked) {
          finishSuccessfully();
        } else {
          showCopyButton();
        }
      }

      copyButton.addEventListener("click", async function () {
        status.textContent = "Copying…";
        copyButton.hidden = true;

        // Run the synchronous method directly from the genuine click.
        if (legacyCopy()) {
          finishSuccessfully();
          return;
        }

        if (await modernCopy()) {
          finishSuccessfully();
          return;
        }

        showCopyButton(
          "Clipboard access is blocked by your Edge settings."
        );
      });

      function checkFocusAndCopy() {
        if (documentIsFocused()) {
          void attemptAutomaticCopy();
        }
      }

      window.addEventListener("focus", checkFocusAndCopy);
      window.addEventListener("pageshow", checkFocusAndCopy);

      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") {
          checkFocusAndCopy();
        }
      });

      // Give the newly opened tab one rendering frame to receive focus.
      window.requestAnimationFrame(function () {
        window.requestAnimationFrame(checkFocusAndCopy);
      });

      // If the browser opened it in the background, keep a manual fallback.
      window.setTimeout(function () {
        if (!completed && !automaticAttempted) {
          showCopyButton(
            "Activate this tab or select the button below to copy."
          );
        }
      }, 1000);
    }());
  </script>
</body>
</html>
