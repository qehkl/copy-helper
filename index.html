<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'none';
      script-src 'unsafe-inline';
      style-src 'unsafe-inline';
      connect-src 'none';
      img-src 'none';
      font-src 'none';
      object-src 'none';
      base-uri 'none';
      form-action 'none';
    "
  >

  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Copy value</title>

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f5f5;
      color: #242424;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel {
      width: min(380px, calc(100% - 40px));
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e1e1e1;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    button {
      margin-top: 16px;
      padding: 9px 18px;
      border: 0;
      border-radius: 4px;
      background: #0f6cbd;
      color: #ffffff;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #115ea3;
    }

    button[hidden] {
      display: none;
    }

    #copySource {
      position: fixed;
      top: 0;
      left: -10000px;
      width: 1px;
      height: 1px;
      padding: 0;
      border: 0;
      opacity: 0;
    }
  </style>
</head>

<body>
  <main class="panel">
    <div id="status" role="status" aria-live="polite">
      Copying…
    </div>

    <button id="copyButton" type="button" hidden>
      Copy to clipboard
    </button>
  </main>

  <textarea
    id="copySource"
    readonly
    aria-hidden="true"
    tabindex="-1"
  ></textarea>

  <script>
    (function () {
      "use strict";

      const status = document.getElementById("status");
      const copyButton = document.getElementById("copyButton");
      const copySource = document.getElementById("copySource");

      const encodedText = window.location.hash.substring(1);

      if (!encodedText) {
        status.textContent = "No value was supplied.";
        return;
      }

      let text;

      try {
        text = decodeURIComponent(encodedText);
      } catch {
        text = encodedText;
      }

      copySource.value = text;

      // Remove the copied value from the visible URL and browser history.
      window.history.replaceState(
        null,
        document.title,
        window.location.pathname + window.location.search
      );

      let completed = false;
      let attemptRunning = false;

      function wait(milliseconds) {
        return new Promise(function (resolve) {
          window.setTimeout(resolve, milliseconds);
        });
      }

      function legacyCopy() {
        try {
          copySource.focus({ preventScroll: true });
          copySource.select();
          copySource.setSelectionRange(0, copySource.value.length);

          return document.execCommand("copy");
        } catch {
          return false;
        }
      }

      async function modernCopy() {
        if (
          !window.isSecureContext ||
          !navigator.clipboard ||
          typeof navigator.clipboard.writeText !== "function"
        ) {
          return false;
        }

        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch {
          return false;
        }
      }

      function finish() {
        if (completed) {
          return;
        }

        completed = true;
        status.textContent = "Copied to clipboard.";
        copyButton.hidden = true;

        copySource.value = "";
        text = "";

        // Brief delay lets Edge finish committing the clipboard operation.
        window.setTimeout(function () {
          window.close();
        }, 350);
      }

      async function attemptCopy() {
        if (completed || attemptRunning || !text) {
          return false;
        }

        attemptRunning = true;

        const modernWorked = await modernCopy();
        const legacyWorked = modernWorked ? false : legacyCopy();

        attemptRunning = false;

        if (modernWorked || legacyWorked) {
          finish();
          return true;
        }

        return false;
      }

      async function automaticCopy() {
        const retryDelays = [0, 100, 300];

        for (const delay of retryDelays) {
          if (delay > 0) {
            await wait(delay);
          }

          if (await attemptCopy()) {
            return;
          }
        }

        status.textContent =
          "Automatic copying was blocked. Select the button below.";

        copyButton.hidden = false;
        copyButton.focus();
      }

      copyButton.addEventListener("click", async function () {
        status.textContent = "Copying…";

        // Run both methods directly from the user's click.
        const legacyWorked = legacyCopy();
        const modernWorked = await modernCopy();

        if (legacyWorked || modernWorked) {
          finish();
        } else {
          status.textContent =
            "Clipboard access is blocked by your browser settings.";
          copyButton.hidden = false;
        }
      });

      // Retry when the new tab becomes focused.
      window.addEventListener("focus", function () {
        if (!completed) {
          void attemptCopy();
        }
      });

      void automaticCopy();
    }());
  </script>
</body>
</html>
