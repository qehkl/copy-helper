<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'none';
      script-src 'unsafe-inline';
      style-src 'unsafe-inline';
      connect-src 'none';
      img-src 'none';
      font-src 'none';
      object-src 'none';
      base-uri 'none';
      form-action 'none';
    "
  >

  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Copy value</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f5f5;
      color: #242424;
    }

    .panel {
      width: min(400px, 100%);
      padding: 24px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e1e1e1;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .spinner {
      width: 24px;
      height: 24px;
      margin: 0 auto 14px;
      border: 3px solid #d6e8f7;
      border-top-color: #0f6cbd;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #status {
      margin: 0;
      font-size: 14px;
    }

    button {
      margin-top: 16px;
      padding: 9px 18px;
      border: 0;
      border-radius: 4px;
      background: #0f6cbd;
      color: #ffffff;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #115ea3;
    }

    input {
      width: 100%;
      margin-top: 16px;
      padding: 9px;
      border: 1px solid #a8a8a8;
      border-radius: 4px;
      font: inherit;
    }

    .help {
      margin: 8px 0 0;
      color: #616161;
      font-size: 12px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="panel">
    <div id="spinner" class="spinner" aria-hidden="true"></div>

    <p id="status" role="status" aria-live="polite">
      Copying…
    </p>

    <button id="copyButton" type="button" hidden>
      Copy now
    </button>

    <input
      id="manualValue"
      type="text"
      readonly
      autocomplete="off"
      spellcheck="false"
      aria-label="Value to copy"
      hidden
    >

    <p id="manualHelp" class="help" hidden>
      If copying is restricted, select the value above and press Ctrl+C.
    </p>
  </main>

  <script>
    (function () {
      "use strict";

      const spinner = document.getElementById("spinner");
      const status = document.getElementById("status");
      const copyButton = document.getElementById("copyButton");
      const manualValue = document.getElementById("manualValue");
      const manualHelp = document.getElementById("manualHelp");

      const encodedValue = window.location.hash.substring(1);
      let value = "";

      try {
        value = decodeURIComponent(encodedValue);
      } catch {
        value = encodedValue;
      }

      // Remove the confidential value from the visible URL and history entry.
      try {
        window.history.replaceState(
          null,
          document.title,
          window.location.pathname + window.location.search
        );
      } catch {
        // Continue even if history modification is unavailable.
      }

      let copying = false;
      let completed = false;

      function legacyCopy(text) {
        const textarea = document.createElement("textarea");

        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        textarea.style.top = "0";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);

        textarea.focus({ preventScroll: true });
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);

        let successful = false;

        try {
          successful = document.execCommand("copy");
        } catch {
          successful = false;
        }

        textarea.remove();
        return successful;
      }

      function showFallback() {
        copying = false;
        spinner.hidden = true;

        status.textContent =
          "Edge blocked automatic copying. Select Copy now.";

        copyButton.hidden = false;

        manualValue.value = value;
        manualValue.hidden = false;
        manualHelp.hidden = false;

        copyButton.focus();
      }

      function copySucceeded() {
        if (completed) {
          return;
        }

        completed = true;
        copying = false;

        spinner.hidden = true;
        status.textContent = "Copied to clipboard.";

        copyButton.hidden = true;
        manualValue.hidden = true;
        manualHelp.hidden = true;
        manualValue.value = "";

        // Clear the retained value before leaving.
        value = "";

        // This is only reached after copying has completed.
        window.close();

        // Shown only if Edge prevents automatic tab closing.
        window.setTimeout(function () {
          status.textContent =
            "Copied to clipboard. You can close this tab.";
        }, 100);
      }

      function copyValue() {
        if (copying || completed || value === "") {
          return;
        }

        copying = true;
        spinner.hidden = false;
        status.textContent = "Copying…";
        copyButton.hidden = true;

        try {
          window.focus();
        } catch {
          // Continue if focus cannot be requested.
        }

        let clipboardPromise = null;

        // Start the modern clipboard request immediately.
        try {
          if (
            window.isSecureContext &&
            navigator.clipboard &&
            typeof navigator.clipboard.writeText === "function"
          ) {
            clipboardPromise = navigator.clipboard.writeText(value);
          }
        } catch {
          clipboardPromise = null;
        }

        // Also attempt the synchronous Edge/Chromium fallback.
        const legacySucceeded = legacyCopy(value);

        if (legacySucceeded) {
          if (clipboardPromise) {
            clipboardPromise.catch(function () {
              // The synchronous copy has already succeeded.
            });
          }

          copySucceeded();
          return;
        }

        if (clipboardPromise) {
          clipboardPromise.then(
            copySucceeded,
            showFallback
          );
        } else {
          showFallback();
        }
      }

      copyButton.addEventListener("click", copyValue);

      manualValue.addEventListener("click", function () {
        manualValue.select();
      });

      manualValue.addEventListener("focus", function () {
        manualValue.select();
      });

      window.addEventListener("pagehide", function () {
        value = "";
        manualValue.value = "";
      });

      if (value === "") {
        spinner.hidden = true;
        status.textContent = "No value was supplied.";
        return;
      }

      // Start immediately—not on window.onload.
      copyValue();
    })();
  </script>
</body>
</html>
