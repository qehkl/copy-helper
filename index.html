<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'none';
      script-src 'unsafe-inline';
      style-src 'unsafe-inline';
      connect-src 'none';
      img-src 'none';
      font-src 'none';
      object-src 'none';
      base-uri 'none';
      form-action 'none';
    "
  >

  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Copy value</title>

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f5f5;
      color: #242424;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel {
      width: min(380px, calc(100% - 40px));
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e1e1e1;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    button {
      margin-top: 16px;
      padding: 9px 18px;
      border: 0;
      border-radius: 4px;
      background: #0f6cbd;
      color: #ffffff;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #115ea3;
    }

    button[hidden] {
      display: none;
    }

    #copySource {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 1px;
      height: 1px;
      padding: 0;
      border: 0;
      opacity: 0;
    }
  </style>
</head>

<body>
  <main class="panel">
    <div id="status" role="status" aria-live="polite">
      Copying…
    </div>

    <button id="copyButton" type="button" hidden>
      Copy to clipboard
    </button>
  </main>

  <textarea
    id="copySource"
    readonly
    aria-hidden="true"
    tabindex="-1"
  ></textarea>

  <script>
    (function () {
      "use strict";

      const status = document.getElementById("status");
      const copyButton = document.getElementById("copyButton");
      const copySource = document.getElementById("copySource");

      const parameters = new URLSearchParams(window.location.search);
      const shouldReturn = parameters.get("return") === "1";
      const encodedValue = window.location.hash.substring(1);

      if (!encodedValue) {
        status.textContent = "No value was supplied.";
        return;
      }

      let value;

      try {
        value = decodeURIComponent(encodedValue);
      } catch {
        value = encodedValue;
      }

      copySource.value = value;

      // Remove the confidential value from the current history entry.
      window.history.replaceState(
        null,
        document.title,
        window.location.pathname + window.location.search
      );

      let completed = false;

      function wait(milliseconds) {
        return new Promise(function (resolve) {
          window.setTimeout(resolve, milliseconds);
        });
      }

      function documentIsReady() {
        return (
          document.visibilityState === "visible" &&
          document.hasFocus()
        );
      }

      function waitForFocusedDocument(timeoutMilliseconds) {
        return new Promise(function (resolve) {
          if (documentIsReady()) {
            resolve(true);
            return;
          }

          let settled = false;

          function finish(result) {
            if (settled) {
              return;
            }

            settled = true;

            window.clearTimeout(timeout);
            window.removeEventListener("focus", check);
            window.removeEventListener("pageshow", check);
            document.removeEventListener("visibilitychange", check);

            resolve(result);
          }

          function check() {
            if (documentIsReady()) {
              finish(true);
            }
          }

          const timeout = window.setTimeout(function () {
            finish(false);
          }, timeoutMilliseconds);

          window.addEventListener("focus", check);
          window.addEventListener("pageshow", check);
          document.addEventListener("visibilitychange", check);
        });
      }

      async function modernCopy() {
        if (
          !value ||
          !window.isSecureContext ||
          !documentIsReady() ||
          !navigator.clipboard ||
          typeof navigator.clipboard.writeText !== "function"
        ) {
          return false;
        }

        try {
          await navigator.clipboard.writeText(value);
          return true;
        } catch {
          return false;
        }
      }

      function trustedButtonCopy() {
        if (!value) {
          return false;
        }

        let copyEventHandled = false;

        function handleCopy(event) {
          if (!event.clipboardData) {
            return;
          }

          event.preventDefault();
          event.clipboardData.clearData();
          event.clipboardData.setData("text/plain", value);
          copyEventHandled = true;
        }

        document.addEventListener("copy", handleCopy, { once: true });

        copySource.value = value;
        copySource.focus({ preventScroll: true });
        copySource.select();
        copySource.setSelectionRange(0, copySource.value.length);

        let commandWorked = false;

        try {
          commandWorked = document.execCommand("copy");
        } catch {
          commandWorked = false;
        }

        document.removeEventListener("copy", handleCopy);

        return commandWorked && copyEventHandled;
      }

      function showFallback(message) {
        status.textContent =
          message ||
          "Automatic copying was blocked. Select the button below.";

        copyButton.hidden = false;
        copyButton.focus();
      }

      function finishSuccessfully() {
        if (completed) {
          return;
        }

        completed = true;
        status.textContent = "Copied. Returning…";
        copyButton.hidden = true;

        copySource.value = "";
        value = "";

        // Briefly allow Edge/Windows to settle before navigating back.
        window.setTimeout(function () {
          if (shouldReturn && window.history.length > 1) {
            window.history.back();
          } else {
            status.textContent = "Copied to clipboard.";
          }
        }, 500);
      }

      async function automaticCopy() {
        const focused = await waitForFocusedDocument(3000);

        if (!focused) {
          showFallback();
          return;
        }

        // Short, controlled retries only while this page remains focused.
        const retryDelays = [0, 120, 300];

        for (const delay of retryDelays) {
          if (delay > 0) {
            await wait(delay);
          }

          if (!documentIsReady()) {
            break;
          }

          if (await modernCopy()) {
            finishSuccessfully();
            return;
          }
        }

        showFallback();
      }

      copyButton.addEventListener("click", async function () {
        status.textContent = "Copying…";
        copyButton.hidden = true;

        // This runs synchronously from the user's genuine button click.
        if (trustedButtonCopy()) {
          finishSuccessfully();
          return;
        }

        // Modern API fallback, still initiated by the same click.
        if (await modernCopy()) {
          finishSuccessfully();
          return;
        }

        showFallback(
          "Clipboard access is blocked by your Edge settings."
        );
      });

      void automaticCopy();
    }());
  </script>
</body>
</html>
